[dependencies]
rustcast-core = { path = "../rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
block2 = "0.6.2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
unicode-segmentation = "=1.12.0"
objc2 = "0.6.3"
objc2-uniform-type-identifiers = { version = "0.3.2", default-features = false, features = ["std", "UTType"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFRunLoop", "CFString", "CFDate"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSObject", "NSString", "NSGeometry", "NSNotification", "NSOperation", "NSArray", "NSData", "NSValue", "NSRunLoop", "NSDate", "NSIndexSet", "NSUndoManager", "NSURL", "NSUUID", "NSLocale", "NSDateFormatter", "NSCalendar", "NSISO8601DateFormatter", "NSAppleEventDescriptor", "libc", "objc2-core-services", "NSTimeZone", "NSCharacterSet", "NSRegularExpression", "NSTextCheckingResult", "NSFileManager", "NSPathUtilities", "NSEnumerator", "NSBundle", "NSError", "NSDictionary", "block2", "NSProcessInfo", "NSByteCountFormatter", "NSURLSession", "NSURLRequest", "NSURLResponse", "NSURLCache", "NSHTTPCookieStorage", "NSURLCredentialStorage"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "objc2-core-foundation", "objc2-uniform-type-identifiers", "NSRulerView", "NSLayoutManager", "NSStringDrawing", "NSAttributedString", "NSSavePanel", "NSOpenPanel", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSApplication", "NSRunningApplication", "NSResponder", "NSWindow", "NSPanel", "NSView", "NSControl", "NSTextField", "NSText", "NSTextView", "NSFont", "NSFontDescriptor", "NSColor", "NSImage", "NSImageView", "NSImageRep", "NSBitmapImageRep", "NSGraphics", "NSBezierPath", "NSGraphicsContext", "NSAccessibility", "NSAccessibilityConstants", "NSAccessibilityProtocols", "NSAppearance", "NSEvent", "NSTableView", "NSTableColumn", "NSTableHeaderView", "NSScrollView", "NSClipView", "NSScroller", "NSTableRowView", "NSCell", "NSButton", "NSButtonCell", "NSScreen", "NSUserInterfaceItemIdentification", "NSParagraphStyle", "NSWorkspace", "block2", "NSPopUpButton", "NSMenu", "NSMenuItem", "NSTextContainer", "NSPasteboard", "NSPasteboardItem", "NSVisualEffectView", "NSLayoutConstraint"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
