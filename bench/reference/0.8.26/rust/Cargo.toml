[package]
name = "rustcast-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "rustcast_core"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "ruycast"
path = "src/bin/ruycast.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
